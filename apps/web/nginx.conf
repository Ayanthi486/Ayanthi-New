# Minimal SPA hosting: react-router's <BrowserRouter> (App.tsx) needs every
# unmatched path to fall back to index.html so client-side routing can take
# over — a raw nginx default would 404 on a hard refresh of e.g. /shipments.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames (Vite's default asset naming) are safe to cache
    # forever; index.html itself must always be revalidated so a new
    # deploy is picked up on next load rather than served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
